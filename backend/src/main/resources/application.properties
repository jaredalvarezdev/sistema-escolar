# ==========================================================
#  Sistema Escolar - Configuración de la aplicación
#  Las credenciales se cargan desde variables de entorno.
#  Consulte backend/.env.example para la lista de variables.
# ==========================================================

# ----------------------------------------------------------
#  Variables de entorno locales
#  Carga backend/.env si existe (excluido del repositorio)
# ----------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# ----------------------------------------------------------
#  Aplicación
# ----------------------------------------------------------
spring.application.name=sistema-escolar
# Puerto HTTP del servidor (por defecto 8080)
server.port=${PORT:8080}

# ----------------------------------------------------------
#  Base de datos - MongoDB Atlas
# ----------------------------------------------------------
# Cadena de conexión al cluster (variable de entorno MONGODB_URI)
spring.mongodb.uri=${MONGODB_URI}
# Nombre de la base de datos
spring.mongodb.database=SistemaEscolarDB
# Los índices únicos los crea el script database/seed/seed.js
spring.data.mongodb.auto-index-creation=false

# ----------------------------------------------------------
#  Seguridad - JSON Web Token (JWT)
# ----------------------------------------------------------
# Clave secreta para firmar los tokens (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET}
# Tiempo de expiración del token en milisegundos (24 horas)
jwt.expiration-ms=86400000